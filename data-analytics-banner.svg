<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dataBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06130d"/>
      <stop offset="50%" stop-color="#0b1e16"/>
      <stop offset="100%" stop-color="#020805"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="dataLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="dataGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#dataBg)"/>
  <rect width="1200" height="300" rx="16" stroke="#134e4a" stroke-width="2"/>

  <!-- Ambient Glow -->
  <circle cx="200" cy="80" r="120" fill="#059669" opacity="0.25" filter="url(#dataGlow)"/>
  <circle cx="1000" cy="220" r="130" fill="#D97706" opacity="0.2" filter="url(#dataGlow)"/>

  <!-- Chart / Data Wave Lines -->
  <g opacity="0.08" stroke="#34D399" stroke-width="1.5">
    <path d="M 0 250 Q 300 150 600 220 T 1200 120" fill="none"/>
    <path d="M 0 200 Q 300 260 600 140 T 1200 190" fill="none"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
    <line x1="550" y1="0" x2="550" y2="300"/>
    <line x1="750" y1="0" x2="750" y2="300"/>
    <line x1="950" y1="0" x2="950" y2="300"/>
    <line x1="1150" y1="0" x2="1150" y2="300"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(460, 36)">
    <rect width="280" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#34D399"/>
    <text x="30" y="18" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">ENTERPRISE DATA &amp; BI PORTFOLIO</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="125" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    ENTERPRISE DATA ANALYTICS &amp; BI
  </text>

  <!-- Gradient Sub-headline -->
  <text x="600" y="168" text-anchor="middle" fill="url(#dataGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Text', sans-serif" font-size="19" font-weight="700" letter-spacing="1.8">
    EXCEL MODELING • SQL TRANSFORMATIONS • POWER BI &amp; TABLEAU
  </text>

  <!-- Accent Divider Line -->
  <line x1="280" y1="195" x2="920" y2="195" stroke="url(#dataLine)" stroke-width="2"/>

  <!-- Tech Badges -->
  <g transform="translate(600, 235)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" fill="#A7F3D0">
    <text x="0" y="0">
      <tspan fill="#34D399" font-weight="600">32,245+ Operational Records</tspan>  •  
      <tspan fill="#6EE7B7" font-weight="600">AlexTheAnalyst SQL Standards</tspan>  •  
      <tspan fill="#FBBF24" font-weight="600">Power BI Star Schema &amp; DAX</tspan>  •  
      <tspan fill="#38BDF8" font-weight="600">Tableau LOD</tspan>
    </text>
  </g>
</svg>